{% extends "base.html" %}
{% block title %}Media — PlexCleaner{% endblock %}

{% block content %}
<section class="card">
  <div class="card-head">
    <h2>Stale media</h2>
    <div class="filters">
      <select id="f-verdict">
        <option value="candidate">Candidates</option>
        <option value="keep">Kept</option>
        <option value="protected">Protected</option>
        <option value="all">Everything</option>
      </select>
      <select id="f-kind">
        <option value="">Movies &amp; shows</option>
        <option value="movie">Movies</option>
        <option value="show">Shows</option>
      </select>
      <select id="f-library"><option value="">All libraries</option></select>
      <input id="f-search" type="search" placeholder="Search title…">
    </div>
  </div>

  <div class="selection-bar">
    <label><input type="checkbox" id="select-all"> Select all shown</label>
    <span id="selection-summary" class="muted">Nothing selected</span>
    <div class="spacer"></div>
    <button id="btn-protect" class="btn" disabled>Never suggest again</button>
    <button id="btn-plan" class="btn btn-primary" disabled>Build deletion plan</button>
  </div>

  <div id="table-wrap"><p class="muted">Loading…</p></div>
  <div class="pager">
    <button id="prev" class="btn btn-small">← Previous</button>
    <span id="page-info" class="muted"></span>
    <button id="next" class="btn btn-small">Next →</button>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
const state = {offset: 0, limit: 100, total: 0, selected: new Set(), rows: [],
               scanId: null, sort: 'size', dir: 'desc', services: {}};

// Column key -> header label. The key is what /api/media sorts on.
const COLUMNS = [
  ['title', 'Title'], ['library', 'Library'], ['size', 'Size'],
  ['watched', 'Last watched'], ['added', 'Added'], ['plays', 'Plays'],
  ['services', 'Services'], ['why', 'Why'],
];

function params() {
  const q = new URLSearchParams({
    verdict: val('f-verdict'), kind: val('f-kind'), library: val('f-library'),
    sort: state.sort, dir: state.dir, search: val('f-search'),
    limit: state.limit, offset: state.offset,
  });
  return '/api/media?' + q.toString();
}

async function load() {
  const data = await api(params());
  if (!data) return;
  state.rows = data.items;
  state.total = data.total;
  state.scanId = data.scan_id;
  state.services = data.services || {};
  state.sort = data.sort || state.sort;
  state.dir = data.dir || state.dir;
  fillLibraries(data.libraries || []);
  render();
}

function fillLibraries(libs) {
  const sel = document.getElementById('f-library');
  if (sel.dataset.filled) return;
  libs.forEach(l => { if (!l) return; const o = document.createElement('option'); o.value = l; o.textContent = l; sel.appendChild(o); });
  sel.dataset.filled = '1';
}

function render() {
  const wrap = document.getElementById('table-wrap');
  if (!state.rows.length) {
    wrap.innerHTML = '<p class="muted">Nothing matches. Run a scan from the dashboard '
      + 'if this is unexpected.</p>';
  } else {
    wrap.innerHTML = `<table class="table">
      <thead><tr>
        <th></th>${COLUMNS.map(headerHtml).join('')}
      </tr></thead>
      <tbody>${state.rows.map(rowHtml).join('')}</tbody></table>`;
    bindHeaders(wrap);
    wrap.querySelectorAll('input[type=checkbox][data-id]').forEach(cb => {
      cb.checked = state.selected.has(Number(cb.dataset.id));
      cb.onchange = () => {
        const id = Number(cb.dataset.id);
        cb.checked ? state.selected.add(id) : state.selected.delete(id);
        updateSelection();
      };
    });
  }
  document.getElementById('page-info').textContent =
    `${state.total ? state.offset + 1 : 0}–${Math.min(state.offset + state.limit, state.total)} of ${state.total}`;
  document.getElementById('prev').disabled = state.offset === 0;
  document.getElementById('next').disabled = state.offset + state.limit >= state.total;
  updateSelection();
}

function headerHtml([key, label]) {
  const active = state.sort === key;
  const arrow = active ? (state.dir === 'asc' ? ' ▲' : ' ▼') : '';
  const next = active && state.dir === 'asc' ? 'descending' : 'ascending';
  return `<th class="sortable${active ? ' sorted' : ''}" data-sort="${key}"
             title="Sort by ${esc(label)} (${next})"
             role="button" tabindex="0"
             aria-sort="${active ? (state.dir === 'asc' ? 'ascending' : 'descending') : 'none'}"
          >${esc(label)}<span class="sort-arrow">${arrow}</span></th>`;
}

function bindHeaders(wrap) {
  wrap.querySelectorAll('th.sortable').forEach(th => {
    const go = () => sortBy(th.dataset.sort);
    th.onclick = go;
    th.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
}

function sortBy(key) {
  // Same column toggles direction; a new column starts at the server's
  // default for it (largest first, longest unwatched first, A-Z, ...).
  if (state.sort === key) {
    state.dir = state.dir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sort = key;
    state.dir = '';
  }
  state.offset = 0;
  load();
}

function linksHtml(r) {
  if (!r.links || !r.links.length) return '';
  return `<div class="svc-links">` + r.links.map(l =>
    `<a class="svc svc-${esc(l.service)}" href="${esc(l.url)}" target="_blank"
        rel="${l.external ? 'noopener noreferrer' : 'noopener'}"
        title="${esc(l.label)}" aria-label="${esc(l.label)}"
     >${esc(l.icon)}</a>`).join('') + `</div>`;
}

function rowHtml(r) {
  const services = [
    (!r.arr && state.services.arr)
      ? `<span class="tag tag-muted" title="No matching entry in Sonarr or Radarr, so there is nothing to link to. Deleting this one falls to Plex.">not in *arr</span>`
      : '',
    r.arr_status ? `<span class="tag tag-muted">${esc(r.arr_status)}</span>` : '',
    r.seerr_requested_by
      ? `<span class="tag" title="Requested in Seerr by ${esc(r.seerr_requested_by)}">req: ${esc(r.seerr_requested_by)}</span>`
      : '',
  ].join(' ');
  return `<tr class="verdict-${esc(r.verdict)}">
    <td><input type="checkbox" data-id="${r.id}"></td>
    <td><strong>${esc(r.title)}</strong> ${r.year ? '<span class="muted">(' + r.year + ')</span>' : ''}
        ${r.kind === 'show' ? `<span class="muted small">${r.episode_count} eps</span>` : ''}
        ${linksHtml(r)}</td>
    <td class="muted nowrap">${esc(r.library || '—')}</td>
    <td class="nowrap">${r.size_gb ? r.size_gb + ' GB' : '<span class="muted">—</span>'}</td>
    <td class="nowrap">${r.last_watched_at ? fmtDate(r.last_watched_at) : '<span class="never">never</span>'}</td>
    <td class="muted nowrap">${fmtDate(r.added_at)}</td>
    <td class="nowrap">${r.play_count}${r.watcher_count ? ` <span class="muted small">/ ${r.watcher_count}</span>` : ''}</td>
    <td>${services || '<span class="muted">—</span>'}</td>
    <td class="muted small reason">${r.reasons.map(esc).join('<br>')}</td>
  </tr>`;
}

function updateSelection() {
  const n = state.selected.size;
  const gb = state.rows.filter(r => state.selected.has(r.id)).reduce((a, r) => a + (r.size_gb || 0), 0);
  document.getElementById('selection-summary').textContent =
    n ? `${n} selected (${gb.toFixed(1)} GB on this page)` : 'Nothing selected';
  document.getElementById('btn-plan').disabled = n === 0;
  document.getElementById('btn-protect').disabled = n === 0;
}

document.getElementById('select-all').onchange = (e) => {
  state.rows.forEach(r => e.target.checked ? state.selected.add(r.id) : state.selected.delete(r.id));
  render();
};
document.getElementById('btn-plan').onclick = async () => {
  const res = await api('/api/plans', {method: 'POST', body: JSON.stringify({
    scan_id: state.scanId, media_ids: [...state.selected], user_ids: [],
  })});
  if (res) location.href = '/plans/' + res.plan_id;
};
document.getElementById('btn-protect').onclick = async () => {
  const chosen = state.rows.filter(r => state.selected.has(r.id));
  for (const r of chosen) {
    await api('/api/protections', {method: 'POST', body: JSON.stringify({
      kind: 'media', ref: r.ref, label: r.title,
    })});
  }
  toast(`${chosen.length} item(s) added to the permanent keep list`);
  state.selected.clear();
  load();
};
document.getElementById('prev').onclick = () => { state.offset = Math.max(0, state.offset - state.limit); load(); };
document.getElementById('next').onclick = () => { state.offset += state.limit; load(); };
['f-verdict','f-kind','f-library'].forEach(id =>
  document.getElementById(id).onchange = () => { state.offset = 0; load(); });
document.getElementById('f-search').oninput = debounce(() => { state.offset = 0; load(); }, 350);

load();
</script>
{% endblock %}
