# PlexCleaner — OPTIONAL config file.
#
# You do not need this file. The normal path is to start the container and
# configure everything in the web UI, which stores settings in the database
# under your /data volume.
#
# This file exists for two cases:
#   * you would rather keep configuration in Git than in a database
#   * you want to pin defaults that the web UI starts from
#
# Precedence, lowest to highest:
#   built-in defaults  <  this file  <  environment variables  <  web UI
#
# So anything you set here can still be changed in the web UI. To make a value
# permanent, either remove it from the UI's saved settings (Settings → reset) or
# set PLEXCLEANER_LOCK_SAFETY=true for the safety block specifically.
#
# Mount it at /config/config.yaml, or point PLEXCLEANER_CONFIG at it.
# ${VAR} is read from the environment, so secrets can stay out of this file.

app:
  # Inside a container leave this alone — the port mapping controls exposure.
  host: "0.0.0.0"
  port: 8585
  # Subnets allowed to reach the web UI. Everything else gets a 403.
  allowed_networks:
    - "10.12.128.0/24"
  # Enable only when a reverse proxy you control sits in front, otherwise the
  # network guard can be bypassed with a forged X-Forwarded-For header.
  trust_proxy: false
  # Leave empty for no login prompt. Generated and persisted automatically if
  # you do not set a signing key.
  password: "${PLEXCLEANER_PASSWORD}"
  secret_key: "${PLEXCLEANER_SECRET_KEY}"
  session_hours: 12
  log_level: "INFO"

safety:
  # While true, NOTHING is deleted — every action is simulated and logged.
  dry_run: true
  confirm_phrase: "DELETE"
  max_media_deletions_per_run: 25
  max_user_removals_per_run: 5
  max_gigabytes_per_run: 2000
  snapshot_before_delete: true
  abort_after_failures: 5

plex:
  enabled: true
  url: "http://10.12.128.4:32400"
  token: "${PLEX_TOKEN}"
  verify_ssl: false
  timeout: 60
  # Empty means every movie and show library.
  libraries: []
  exclude_libraries:
    - "Home Videos"

tautulli:
  enabled: true
  url: "http://10.12.128.4:8181"
  api_key: "${TAUTULLI_API_KEY}"
  verify_ssl: false
  timeout: 60
  purge_history_on_delete: false

# Lists — add more entries for a separate 4K instance.
sonarr:
  - name: "sonarr"
    enabled: true
    url: "http://10.12.128.4:8989"
    api_key: "${SONARR_API_KEY}"
    delete_files: true
    add_import_exclusion: true

radarr:
  - name: "radarr"
    enabled: true
    url: "http://10.12.128.4:7878"
    api_key: "${RADARR_API_KEY}"
    delete_files: true
    add_import_exclusion: true

seerr:
  # Overseerr, Jellyseerr and Seerr all use this same block.
  enabled: true
  url: "http://10.12.128.4:5055"
  api_key: "${SEERR_API_KEY}"
  remove_media_entry: true
  # Leave false when Sonarr/Radarr are enabled — they already delete the files.
  delete_file_via_seerr: false

rules:
  media:
    unwatched_days: 365
    never_watched_after_days: 180
    min_age_days: 30
    protect_continuing_series: true
    protect_in_progress: true
    protect_recent_seerr_requests_days: 90
    protect_plex_labels: ["keep", "favorite"]
    protect_collections: []
    protect_arr_tags: ["keep"]
    include_libraries: []
    min_size_mb: 0

  users:
    inactive_days: 180
    never_active_after_days: 60
    protect_users: []
    protect_admins: true
    protect_home_users: true
    # unshare | remove_friend | none
    plex_action: "unshare"
    remove_from_seerr: true
    remove_from_tautulli: false

schedule:
  # Scheduled scans only refresh the candidate lists. Deletions always need you
  # to review and confirm a plan.
  scan_enabled: true
  scan_cron_hour: 4
  scan_cron_minute: 30
  retention_days: 365
