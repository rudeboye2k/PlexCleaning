services:
  plexcleaner:
    build: .
    image: plexcleaner:latest
    container_name: plexcleaner
    restart: unless-stopped

    # Published on the internal LAN address only. Without the IP prefix Docker
    # would bind 0.0.0.0 and punch a hole in the host firewall via iptables.
    ports:
      - "10.12.128.4:8585:8585"

    volumes:
      - ./config:/config
      - ./data:/data

    environment:
      PLEXCLEANER_CONFIG: /config/config.yaml
      TZ: ${TZ:-UTC}
    env_file:
      - .env

    # Inside the container the app binds all interfaces; the port mapping above
    # plus app.allowed_networks in config.yaml are what keep it internal.
    command: ["serve", "--host", "0.0.0.0", "--port", "8585"]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8585/healthz', timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
