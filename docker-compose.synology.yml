# PlexCleaner for Synology Container Manager.
#
# Identical to docker-compose.yml except it bind-mounts a real folder on
# /volume1 instead of using a named Docker volume, so you can see and back up
# the database through File Station.
#
# Before you start, in File Station create:
#     docker/plexcleaner/data
#
# Then: Container Manager → Project → Create → set the path to that folder,
# choose "Create docker-compose.yml", and paste this in.
services:
  plexcleaner:
    image: ghcr.io/rudeboye2k/plexcleaning:latest
    container_name: plexcleaner
    restart: unless-stopped

    ports:
      - "8585:8585"

    volumes:
      # Adjust volume1 if your shared folder lives on another volume.
      - /volume1/docker/plexcleaner/data:/data

    environment:
      # IMPORTANT on Synology: these must match the owner of the folder above,
      # or the container cannot write its database. Over SSH, run:
      #     id your-dsm-username
      # DSM's first user is usually uid 1026, and the "users" group is gid 100.
      PUID: 1026
      PGID: 100
      UMASK: "022"
      TZ: Europe/London

      # Restrict the web UI to your LAN subnet.
      PLEXCLEANER_ALLOWED_NETWORKS: "10.12.128.0/24"

      # Recommended, since DSM users may share the NAS.
      # PLEXCLEANER_PASSWORD: "change-me"

      # If you publish this through DSM's built-in reverse proxy, set this so
      # the network guard sees the real client address rather than the proxy's.
      # PLEXCLEANER_TRUST_PROXY: "true"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8585/healthz', timeout=8).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
